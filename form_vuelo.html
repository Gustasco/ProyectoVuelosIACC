<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registrar Vuelo</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
  function validarVuelo() {
    // Aquí puedes agregar validaciones personalizadas si quieres
    return true;
  }
  </script>
</head>
<body>
  <div class="container">
    <h2>Registrar Vuelo</h2>
    <form action="insertar_vuelo.php" method="POST" onsubmit="return validarVuelo()">
      <label for="origen">Origen:</label>
      <input type="text" id="origen" name="origen" required>

      <label for="destino">Destino:</label>
      <input type="text" id="destino" name="destino" required>

      <label for="fecha">Fecha:</label>
      <input type="date" id="fecha" name="fecha" required>

      <label for="plazas">Plazas disponibles:</label>
      <input type="number" id="plazas" name="plazas" min="1" required>

      <label for="precio">Precio:</label>
      <input type="number" id="precio" name="precio" step="0.01" min="0" required>

      <input type="submit" value="Registrar">
    </form>
  </div>
</body>
</html>
